[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auth"
version = "0.23.0+aad"
description = "V2-23 fail-closed JWT / founder 2FA stubs for control and gateway. Paper only."
readme = "README.md"
requires-python = ">=3.11"
# Sibling packages are installed by scripts/ci/install.sh with --no-deps.
# Stdlib HMAC-SHA256 JWT (ponytail). pyjwt is the M2 upgrade after V2-24.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auth = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]
