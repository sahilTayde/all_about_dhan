[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indicators"
version = "0.1.0"
description = "V2-05 feature engine: incremental indicators on closed bars only (paper)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marketdata==0.1.0+aad",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = "src:tests"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["marketdata.*"]
follow_imports = "silent"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
