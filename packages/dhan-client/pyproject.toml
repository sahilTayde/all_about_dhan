[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhan-client"
version = "0.1.0"
description = "Generic DhanHQ v2 REST + WebSocket skeleton (no orders, no strategy)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dhan-client = "dhan_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dhan_client = ["py.typed"]
