[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0+aad"
description = "Append-only SQLite paper ledger and Indian index-option charges. No live orders."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledger = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ledger/migrate.py", "src/ledger/v2.py", "src/ledger/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
