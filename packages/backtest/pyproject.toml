[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-engine"
version = "0.1.0"
description = "Fixture/live-OHLC backtests. No orders. No invented win rates."
requires-python = ">=3.9"
dependencies = ["dhan-client"]

[project.scripts]
backtest-engine = "backtest_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
