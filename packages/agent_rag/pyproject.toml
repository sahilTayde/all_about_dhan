[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rag"
version = "0.1.0"
description = "Agent speed KB (SQLite FTS5) + paper backtest rollup + EOD recon stub. Does not touch transcripts.sqlite."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
agent-rag = "agent_rag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_rag = ["py.typed"]
