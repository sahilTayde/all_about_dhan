[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agents-india"
version = "0.1.0"
description = "India index-options multi-agent paper signal orchestration (TradingAgents-inspired; DhanHQ-only; no live orders)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
trading-agents-india = "trading_agents_india.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_agents_india = ["py.typed"]
