# Charges for Indian index options (NIFTY / BANKNIFTY / SENSEX), applied per executed order.
# Read by packages/ledger (ledger.charges.load_rates). No secrets here.
#
# Flat rates match packages/desk-ml/src/desk_ml/groww_costs.py (invent/replay + legacy paper).
# Dhan/NSE-sourced paper model — not contract-note authority. Check
# https://dhan.co/pricing and NSE/FA/73061 before going live. Clearing fee UNCLEAR/omitted.

brokerage_per_order_inr: 20.0   # Dhan: flat ₹20 per executed F&O order (once per order, not per partial fill)
stt_sell_premium_frac: 0.0015   # STT 0.15% of sell-side premium (NSE, from 1 Apr 2026)
exchange_txn_frac: 0.000355299  # NSE equity-options txn ₹3,552.99/crore (NSE/FA/73061 from 2026-03-01)
ipft_frac: 0.000000001          # NSE IPFT ₹0.01/crore; Dhan 0.0000001% of turnover; in GST base
sebi_fee_frac: 0.000001         # SEBI turnover fee, ₹10 per crore, both sides
stamp_duty_buy_frac: 0.00003    # stamp duty 0.003% of buy-side premium only
gst_frac: 0.18                  # GST 18% on (brokerage + txn + SEBI + IPFT); not STT/stamp

# Per-exchange options transaction charge, both sides, on premium. Used only when a caller asks
# for per-exchange rates (paper cost_model: realistic, config/paper_costs.yaml). NSE figure here
# is txn + IPFT combined (₹3,553/crore) so V2/realistic does not double-count IPFT. Flat callers
# use exchange_txn_frac + ipft_frac instead. BSE IPFT is not listed here (do not invent).
exchange_txn_frac_by_exchange:
  NSE: 0.0003553   # NSE/FA/73061: Rs 3,552.99 txn + Rs 0.01 IPFT per crore premium (combined)
  BSE: 0.000325    # BSE notice 20240927-37 (from 1 Oct 2024): SENSEX/BANKEX options Rs 3,250 per crore premium
underlying_exchange:
  NIFTY: NSE
  BANKNIFTY: NSE
  FINNIFTY: NSE
  MIDCPNIFTY: NSE
  SENSEX: BSE
  BANKEX: BSE
