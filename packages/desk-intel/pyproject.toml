[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-intel"
version = "0.1.0"
description = "PRE_MARKET news+tape+chain fusion and POST_MARKET paper/shadow recon (not advice)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desk-intel = "desk_intel.__main__:main"
jobs = "desk_intel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desk_intel = ["py.typed"]
