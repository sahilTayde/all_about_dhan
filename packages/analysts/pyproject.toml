[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysts"
version = "0.1.0"
description = "Analyst registry, room, and log-only shadow features. Paper only. No orders."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
export-shadow-audit = "analysts.shadow_export:main"

[tool.setuptools.packages.find]
where = ["src"]
