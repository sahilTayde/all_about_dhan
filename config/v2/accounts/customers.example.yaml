# Optional C5-01 customer overlay. Paper only. No secrets. No live broker.
# Copy to customers.yaml (gitignored) and export AAD_CUSTOMERS=/path/to/customers.yaml
# only when config/v2/accounts.yaml does not already list these ids.
# Cap: 5 customer books for this launch. Status disabled until:
#   python -m accounts enable --config "$AAD_CUSTOMERS" --account customer-01

accounts:
