[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "events"
version = "0.1.0"
description = "Typed JSON event bus (in-memory + optional Redis) and SQLite audit log. Paper only."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
