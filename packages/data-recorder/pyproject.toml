[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-recorder"
version = "0.1.0"
description = "Daily index, futures, and option-chain recorder. No orders."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["dhan-client"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
