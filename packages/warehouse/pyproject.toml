[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aad-warehouse"
version = "0.1.0"
description = "Append-only SQLite warehouse for paper desk events. Never writes transcripts.sqlite. No live orders."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aad-warehouse = "warehouse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warehouse = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/warehouse/etl.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
