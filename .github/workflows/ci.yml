# CI on every PR. PAPER ONLY: no secrets are referenced, no broker is reachable (sockets to
# anything but localhost fail in tests), third-party actions are pinned by commit SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Secrets, large files, data payloads, private data in fixtures
        run: python scripts/ci/scan_repo.py --self-test && python scripts/ci/scan_repo.py
      - name: Install (hash-pinned third party, local packages --no-deps) + local-name guard
        run: bash scripts/ci/install.sh
      - name: Fixtures are generated, not hand-edited
        run: python -m desk_ml.testing.canonical

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/ci/install.sh
      - name: Every package's tests (no network, no sims)
        run: bash scripts/ci/unit.sh

  frozen-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: Frozen legacy engine files are unchanged (manifest check)
        run: python scripts/ci/check_frozen_legacy.py

  golden-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: Flag-on event path equals the flag-off monolith (parity)
        run: python -m desk_ml.event_parity --fixture packages/desk-ml/tests/fixtures/synthetic_session_nifty.json
      - name: Legacy replays are byte-identical to the goldens (flag off and flag on), determinism contract
        run: python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost packages/desk-ml/tests/test_golden_replay.py

  faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "control or tape or skew or restart_every or params or corrupt"
          - "not (control or tape or skew or restart_every or params or corrupt)"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: Fault-injection full-day live-loop sims (invariants I1-I10)
        run: >-
          python -m pytest -q -p no:cacheprovider -p no:logging --allow-hosts=127.0.0.1,localhost
          -m sim -k "${{ matrix.shard }}" packages/desk-ml/tests/test_sims.py

  # V2-15 / architecture §5.3 — jobs that can stay green on this branch.
  # frozen-legacy (above) is the real V2-17 job from main. Not added:
  # no-lookahead (V2-03 harness), perf (V2-16 runner), or a second frozen job.
  # Existing hygiene/unit/golden-replay/faults stay.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: >-
          python -m ruff check packages/runtime packages/control packages/shadow packages/accounts
          packages/auth
          packages/secretstore
          apps/api/src/api/v2_gateway.py
          apps/api/src/api/gateway_auth.py
          packages/warehouse/src/warehouse/etl.py
          packages/warehouse/src/warehouse/calendar.py
          packages/warehouse/src/warehouse/__init__.py
          packages/premarket
          packages/strategies/src/strategies/forward
          packages/strategies/src/strategies/plugins/lab_lock.py
          packages/strategies/src/strategies/plugins/r8_e1_coil_side.py
          packages/strategies/src/strategies/plugins/r8_e2_p5_hv.py
          packages/strategies/src/strategies/plugins/r8_e3_hv_gate.py
      - run: >-
          python -m ruff format --check packages/runtime packages/control packages/shadow packages/accounts
          packages/auth
          packages/secretstore
          apps/api/src/api/v2_gateway.py
          apps/api/src/api/gateway_auth.py
          packages/warehouse/src/warehouse/etl.py
          packages/warehouse/src/warehouse/calendar.py
          packages/warehouse/src/warehouse/__init__.py
          packages/premarket
          packages/strategies/src/strategies/forward
          packages/strategies/src/strategies/plugins/lab_lock.py
          packages/strategies/src/strategies/plugins/r8_e1_coil_side.py
          packages/strategies/src/strategies/plugins/r8_e2_p5_hv.py
          packages/strategies/src/strategies/plugins/r8_e3_hv_gate.py

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - run: python -m pip install mypy
      - name: mypy --strict on new packages
        run: >-
          python -m mypy --strict packages/runtime packages/control/src packages/shadow/src packages/accounts/src
          packages/auth/src
          packages/secretstore/src
          packages/warehouse/src/warehouse/etl.py
          packages/warehouse/src/warehouse/calendar.py
          packages/premarket/src
      - name: mypy --strict on strategies.forward and V2-20b plugins
        run: >-
          python -m mypy --strict src/strategies/forward
          src/strategies/plugins/lab_lock.py
          src/strategies/plugins/r8_e1_coil_side.py
          src/strategies/plugins/r8_e2_p5_hv.py
          src/strategies/plugins/r8_e3_hv_gate.py
        working-directory: packages/strategies

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: Engine + in-memory bus (V2-15 stub + V2-02)
        run: >-
          python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost
          packages/runtime/tests packages/events/tests packages/shadow/tests
          packages/secretstore/tests

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: REG-* (no skip, no xfail)
        run: >-
          python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost
          tests/regression -p no:cacheprovider
          -k "not skip"
          --override-ini="xfail_strict=true"

  determinism:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: Determinism (V2-04 owns tape hash; golden-replay covers legacy)
        run: python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost packages/desk-ml/tests/test_golden_replay.py

  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: Replay compose profile has no credentials
        run: >-
          python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost
          packages/runtime/tests/test_v2_15.py -k compose
      - name: V2 shadow dry-run demo (no network, no live orders)
        run: python -m shadow dry-run --state-dir /tmp/aad-shadow-dry --day 2026-10-04

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - run: python -m docs_auditor

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Build aad-python (no secrets, no push)
        run: docker build -f deploy/docker/Dockerfile -t aad-python:ci .

  # V2-16 / architecture §5.3 — add only. Existing jobs above stay bit-for-bit.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: Perf budgets (2x CI headroom, no network)
        run: python scripts/gate/merge_gate.py --only perf

  no-lookahead:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - name: Look-ahead cut tests (#25 + V2-03 random-cut)
        run: >-
          python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost
          packages/marketdata/tests/test_bar_lookahead.py
          packages/indicators/tests/test_lookahead.py
          packages/oms/tests/test_lookahead_fills.py
          packages/desk-ml/tests/test_reliability.py::test_F3_root_cause_live_logit_sees_the_same_bars_in_every_cycle

  # V2-21 / architecture §3.2 — same LedgerStore suite on Postgres. Paper only.
  ledger-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aad
          POSTGRES_PASSWORD: aad
          POSTGRES_DB: aad_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aad -d aad_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STATE_DSN: postgresql://aad:aad@127.0.0.1:5432/aad_ledger
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - run: python -m pip install "psycopg[binary]>=3.2" ruff mypy
      - name: lint/types on V2-21 modules
        run: >-
          python -m ruff check packages/ledger/src/ledger/postgres.py
          packages/ledger/src/ledger/export.py
          packages/ledger/src/ledger/__main__.py
          && python -m ruff format --check packages/ledger/src/ledger/postgres.py
          packages/ledger/src/ledger/export.py
          packages/ledger/src/ledger/__main__.py
          && python -m mypy --strict packages/ledger/src/ledger/postgres.py
          packages/ledger/src/ledger/export.py
          packages/ledger/src/ledger/__main__.py
      - name: Dual-engine ledger tests (sqlite + postgres)
        run: >-
          python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost
          packages/ledger/tests/test_v2_21_postgres.py

  # Mac legacy desk is CPython 3.9. This job is the permanent import/route guard.
  legacy-py39:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.9"
      - name: Legacy Mac install (api reqs + httpx + --no-deps desk-ml, dhan-client, backtest)
        run: |
          python -m pip install -r apps/api/requirements.txt "httpx>=0.27"
          python -m pip install --no-deps --no-build-isolation \
            -e packages/desk-ml -e packages/dhan-client -e packages/backtest
      - name: import api.main and token-free /health /paper/founder-book
        run: bash scripts/ci/legacy_py39.sh

  gate:
    if: always()
    needs:
      - hygiene
      - unit
      - frozen-legacy
      - golden-replay
      - faults
      - lint
      - types
      - integration
      - regression
      - determinism
      - dry-run
      - docs
      - image
      - perf
      - no-lookahead
      - ledger-pg
      - legacy-py39
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: bash scripts/ci/install.sh
      - run: python -m pip install ruff mypy
      - run: python -m ruff check scripts/gate tests/gate
      - run: python -m ruff format --check scripts/gate tests/gate
      - run: python -m mypy --strict scripts/gate
      - name: V2-16 acceptance (no network)
        run: >-
          python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost
          tests/gate
      - name: Write required CI conclusions (fail-closed; no GitHub client)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("ci-conclusions.json").write_text(
              json.dumps(
                  {
                      "hygiene": """${{ needs.hygiene.result }}""",
                      "unit": """${{ needs.unit.result }}""",
                      "frozen-legacy": """${{ needs['frozen-legacy'].result }}""",
                      "golden-replay": """${{ needs['golden-replay'].result }}""",
                      "faults": """${{ needs.faults.result }}""",
                      "lint": """${{ needs.lint.result }}""",
                      "types": """${{ needs.types.result }}""",
                      "integration": """${{ needs.integration.result }}""",
                      "regression": """${{ needs.regression.result }}""",
                      "determinism": """${{ needs.determinism.result }}""",
                      "dry-run": """${{ needs['dry-run'].result }}""",
                      "docs": """${{ needs.docs.result }}""",
                      "image": """${{ needs.image.result }}""",
                      "perf": """${{ needs.perf.result }}""",
                      "no-lookahead": """${{ needs['no-lookahead'].result }}""",
                      "ledger-pg": """${{ needs['ledger-pg'].result }}""",
                      "legacy-py39": """${{ needs['legacy-py39'].result }}""",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Honest empty fault-row list
        if: always()
        run: printf '%s\n' '{"rows":{}}' > fault-rows.json
      - name: Merge gate verdict (advisory unless GATE_ENFORCE=1; never merges)
        if: always()
        run: |
          python -m pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,localhost \
            tests/regression --junitxml=pytest-regression.xml \
            -k "not skip" --override-ini="xfail_strict=true" || true
          python scripts/gate/merge_gate.py \
            --ci-conclusions ci-conclusions.json \
            --pytest-results pytest-regression.xml \
            --fault-rows fault-rows.json \
            --json-out gate-verdict.json
      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.0
        with:
          name: gate-verdict
          path: gate-verdict.json
