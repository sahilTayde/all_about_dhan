[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-auditor"
version = "0.1.0"
description = "Standing docs vs code auditor (no web scrape, never prints secrets)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docs-auditor = "docs_auditor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docs_auditor = ["py.typed"]
