[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdata"
version = "0.1.0"
description = "V2 market data recorder: depth, quote snapshots, OI cadence (record only, no orders)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dhan-client==0.1.0+aad",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "rfc3339-validator>=0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketdata = ["schemas/*.json"]

[tool.uv.sources]
dhan-client = { workspace = true }

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = "src:tests"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dhan_client.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# test-only dependency without bundled types
module = ["jsonschema"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "ARG"]
