# Order matters only for tie labels in the picker; keep the paper engine's room order below.
# Add a new analyst / research feature: register it in code with `@analysts.register("KEY")`,
# then append "KEY" here. It then votes in the picker majority like the others.
# Timeout or crash = ABSTAIN for that analyst; the boss carries on with the rest.
