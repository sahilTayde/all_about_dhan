[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-ml"
version = "0.1.0"
description = "ML-001 local KMeans+IsolationForest overlay. No live orders. No auto-retune."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desk-ml = "desk_ml.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desk_ml = ["py.typed"]
