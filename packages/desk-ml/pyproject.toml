[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-ml"
version = "0.1.0+aad"
description = "ML-001 KMeans+IF and ML-002 MRR/OU overlays. No live orders. No auto-retune."
readme = "README.md"
requires-python = ">=3.9"
# In-repo only: +aad cannot come from PyPI. uv resolves it from the workspace.
dependencies = ["trading-agents-india==0.1.0+aad", "risk-engine==0.1.0+aad"]  # risk-engine: paper guard on the flag-off path

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desk-ml = "desk_ml.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desk_ml = ["py.typed"]

[tool.uv.sources]
trading-agents-india = { workspace = true }
risk-engine = { workspace = true }
