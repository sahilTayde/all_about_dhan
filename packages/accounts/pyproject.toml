[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "accounts"
version = "0.1.0+aad"
description = "V2-22 fail-closed paper/shadow accounts, isolation, and signal/exec split. No live broker."
readme = "README.md"
requires-python = ">=3.11"
# Sibling in-repo packages (contracts) are installed by scripts/ci/install.sh
# with --no-deps. Do not list bare PyPI names here.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.0.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accounts = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "contracts.*"]
ignore_missing_imports = true
