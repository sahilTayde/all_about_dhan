[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health"
version = "0.1.0"
description = "Founder health monitor: recorder, paper engine, recon, risk vetoes. No orders."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
health = "health.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
