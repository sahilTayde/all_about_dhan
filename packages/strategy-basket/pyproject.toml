[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-basket"
version = "0.1.0"
description = "Strategy registry and shadow basket selector for the boss. Paper only; logs, never orders. Off by default."
requires-python = ">=3.9"
dependencies = ["PyYAML>=6", "desk-ml==0.1.0+aad"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
desk-ml = { workspace = true }
