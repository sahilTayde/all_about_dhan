# LLM shadow judge on the dual-tape loop. Paper / shadow only.
# shadow: true  — log PICK/EXIT verdicts to the decision journal + data/shadow/<day>.jsonl
# trade: false  — hard lock. The judge never changes a paper-slot or shadow-rule fill.
# The OpenAI key is read from OPENAI_API_KEY at call time. Missing key → skip, no exception.
# Never put a key here.
#
# R4 take/skip prompt is not in git. Drop the frozen file (sha256 prefix d31a9c85)
# from the box path research/lab/2026-10-11_llm_debrief/ at r4_prompt_path.
# Missing file → MISSING_PROMPT (loud). Wrong hash → LOCK_MISMATCH. Never SLOT_EMPTY.
# Override with LLM_R4_PROMPT_PATH / LLM_R4_SHA256_PREFIX.
shadow: true
trade: false
timeout_s: 3
model: gpt-4o-mini
cache_size: 256
max_output_tokens: 200
price_usd_per_1m_tokens:
  input: 0.15
  output: 0.60
r4_prompt_path: research/lab/2026-10-11_llm_debrief/R4/prompt.txt
r4_sha256_prefix: d31a9c85
