[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premarket"
version = "0.1.0+aad"
description = "V2-18 pre-market PRE_MARKET_SUMMARY, event-day holds, HAR inputs. Paper only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
premarket = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
