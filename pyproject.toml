# Repo root: not a package. uv workspace (in-repo dependencies never resolve from PyPI)
# and shared pytest settings. pip users: see docs/PHASE2_NOTES.md for the one install command.

[tool.uv.workspace]
members = [
    "packages/agent_rag",
    "packages/analysts",
    "packages/backtest",
    "packages/boss",
    "packages/brokers",
    "packages/data-recorder",
    "packages/desk",
    "packages/desk-intel",
    "packages/desk-ml",
    "packages/dhan-client",
    "packages/marketdata",
    "packages/docs-auditor",
    "packages/events",
    "packages/health",
    "packages/ledger",
    "packages/risk-engine",
    "packages/trading_agents_india",
    "packages/warehouse",
    "apps/api",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "network: needs internet (pip/PyPI); skips when offline",
    "sim: fault-injection full-day live-loop simulations (CI job: faults)",
    "slow: long-running; excluded from the unit job",
    "reg11a_probe: REG-11a test data guard probe (exempt from guard)",
]
