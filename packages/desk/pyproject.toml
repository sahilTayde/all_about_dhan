[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk"
version = "0.1.0"
description = "Paper desk: founder, risk engine, PaperBroker, ledger. Does not touch the live-order gate."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["brokers", "risk-engine", "ledger", "desk-ml"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
