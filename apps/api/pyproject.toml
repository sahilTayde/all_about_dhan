[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-about-dhan-api"
version = "0.1.0"
description = "FastAPI skeleton: health + mock dashboard signals. DhanHQ only."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "dhan-client",
    "backtest-engine",
]

[project.scripts]
aad-api = "api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
