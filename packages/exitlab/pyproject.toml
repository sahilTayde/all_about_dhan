[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exitlab"
version = "0.1.0+aad"
description = "Paper/replay exit harness and library. No broker calls. Opt-in only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ledger==0.1.0+aad",
    "oms==0.1.0+aad",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.0.0", "ruff>=0.1.0"]
history = ["pyarrow>=14"]

[project.scripts]
exitlab = "exitlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exitlab = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ledger.*", "oms.*", "yaml", "pyarrow", "pyarrow.*", "boss.*", "desk_ml.*", "strategies.*"]
ignore_missing_imports = true

[tool.uv.sources]
ledger = { workspace = true }
oms = { workspace = true }
